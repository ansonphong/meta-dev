name: Test Meta-Dev Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get install -y shellcheck
          pip3 install jsonschema

      - name: Run plugin tests
        run: bash plugins/meta-dev/scripts/test-plugin.sh

      - name: Validate golden files
        run: |
          FAILED=0
          GOLDEN_DIR="plugins/meta-dev/tests/golden"
          validate_json() {
            python3 -c "import json; json.load(open('$1'))" 2>/dev/null && echo "PASS: $(basename $1) valid JSON" || { echo "FAIL: $(basename $1) invalid JSON"; FAILED=1; }
          }
          validate_nonempty() {
            [ -s "$1" ] && echo "PASS: $(basename $1) non-empty" || { echo "FAIL: $(basename $1) empty"; FAILED=1; }
          }
          # JSON golden files
          validate_json "$GOLDEN_DIR/blank-init/state.json"
          validate_json "$GOLDEN_DIR/classify-out.json"
          validate_json "$GOLDEN_DIR/state-after-replay.json"
          validate_json "$GOLDEN_DIR/version-bump/version.json"
          # Markdown golden files
          validate_nonempty "$GOLDEN_DIR/changelog-cut/RELEASE_NOTES.md"
          validate_nonempty "$GOLDEN_DIR/inbox-after-clear.md"
          [ "$FAILED" -eq 0 ] && echo "All golden file checks passed" || exit 1
